<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepCam — Вход на платформу</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090a0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ================= 1. ОВЕРЛЕЙ ИНТРО ================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #111522 0%, #06070a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: all;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s;
    }

    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Контейнер надписи */
    .title-box {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      user-select: none;
    }

    .word {
      display: inline-flex;
    }

    /* Буквы, которые падают */
    .char {
      display: inline-block;
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(0, 210, 255, 0.45);
      opacity: 0;
      transform: translateY(-700px) rotate(calc(var(--rand-rot) * 1deg)) scale(1.4);
      animation: dropDown 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      animation-delay: calc(var(--delay) * 55ms);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s, filter 0.8s;
      will-change: transform, opacity;
    }

    /* Неоновое свечение для ключевого слова */
    .highlight .char {
      color: #00d2ff;
      text-shadow: 0 0 35px rgba(0, 210, 255, 0.8), 0 0 70px rgba(0, 210, 255, 0.4);
    }

    /* Анимация падения с силой гравитации и легким отскоком */
    @keyframes dropDown {
      0% {
        opacity: 0;
        transform: translateY(-700px) rotate(calc(var(--rand-rot) * 1.5deg)) scale(1.6);
      }
      65% {
        opacity: 1;
        transform: translateY(20px) rotate(calc(var(--rand-rot) * -0.2deg)) scale(0.95);
      }
      85% {
        transform: translateY(-8px) rotate(0deg) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    /* Состояние взрыва / рассыпания */
    .shattered .char {
      opacity: 0 !important;
      filter: blur(8px);
      transform: translate(calc(var(--shatter-x) * 1.8px), calc(var(--shatter-y) * 1.8px)) 
                 rotate(calc(var(--shatter-rot) * 2deg)) 
                 scale(0.15) !important;
    }

    /* Осколки и пылевые искры */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #00d2ff;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px #00d2ff;
      animation: explode 0.8s ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }

    /* ================= 2. ОСНОВНОЙ САЙТ ================= */
    #site-content {
      opacity: 0;
      transform: scale(0.97) translateY(20px);
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #site-content.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    nav {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
      color: #00d2ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: #00d2ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00d2ff;
    }

    .hero-section {
      flex: 1;
      max-width: 900px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 99px;
      color: #a4f4fd;
      font-size: 13px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 20px;
    }

    p.subtext {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.65);
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: #00d2ff;
      color: #050b14;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.35);
    }

    .btn-primary:hover {
      background: #39ddff;
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- 1. ИНТРО-ОВЕРЛЕЙ -->
  <div id="intro-screen">
    <div class="title-box" id="titleBox"></div>
  </div>

  <!-- 2. ОСНОВНОЙ КОНТЕНТ САЙТА -->
  <div id="site-content">
    <nav>
      <div class="brand">
        <span class="brand-dot"></span> PrepCam Platform
      </div>
      <div>
        <button class="btn btn-secondary" onclick="restartIntro()" style="padding: 8px 18px; font-size: 13px;">
          ↺ Повторить анимацию
        </button>
      </div>
    </nav>

    <main class="hero-section">
      <span class="badge">AI Тренажёр собеседований</span>
      <h1>Готовьтесь к офферу с живым интервьюером</h1>
      <p class="subtext">
        Тренируйтесь отвечать на реальные кейсы с контролем тайминга, видеозаписью и обратной связью прямо в браузере.
      </p>
      <div class="buttons">
        <button class="btn btn-primary">Начать тренировку</button>
        <button class="btn btn-secondary">Выбрать направление</button>
      </div>
    </main>
  </div>

  <script>
    // Текст надписи при входе (можно заменить на любой свой)
    const INTRO_TEXT = "ТВОЕ ИНТЕРВЬЮ НАЧИНАЕТСЯ";
    const HIGHLIGHT_WORD = "НАЧИНАЕТСЯ"; // слово с особым неоновым свечением

    function runIntro() {
      const introScreen = document.getElementById("intro-screen");
      const siteContent = document.getElementById("site-content");
      const titleBox = document.getElementById("titleBox");

      // Сброс классов перед новым запуском
      introScreen.classList.remove("fade-out");
      siteContent.classList.remove("visible");
      titleBox.innerHTML = "";
      titleBox.classList.remove("shattered");

      let charIndex = 0;
      const words = INTRO_TEXT.split(" ");

      // Разбиваем текст на слова и буквы с расчетом задержек и разброса
      words.forEach((word) => {
        const wordSpan = document.createElement("span");
        wordSpan.classList.add("word");
        if (word === HIGHLIGHT_WORD) {
          wordSpan.classList.add("highlight");
        }

        [...word].forEach((char) => {
          const charSpan = document.createElement("span");
          charSpan.classList.add("char");
          charSpan.textContent = char;

          // Случайный наклон при падении
          const randRot = (Math.random() - 0.5) * 50;
          charSpan.style.setProperty("--rand-rot", randRot);
          charSpan.style.setProperty("--delay", charIndex);

          // Векторы для будущего взрыва (рассыпания во все стороны)
          const angle = Math.random() * Math.PI * 2;
          const distance = 400 + Math.random() * 500;
          charSpan.style.setProperty("--shatter-x", Math.cos(angle) * distance);
          charSpan.style.setProperty("--shatter-y", Math.sin(angle) * distance);
          charSpan.style.setProperty("--shatter-rot", (Math.random() - 0.5) * 720);

          wordSpan.appendChild(charSpan);
          charIndex++;
        });

        titleBox.appendChild(wordSpan);
      });

      // Тайминг:
      // 1. Падение всех букв занимает ~ (charIndex * 55мс) + 850мс
      const totalDropDuration = charIndex * 55 + 850;

      // 2. Делаем небольшую паузу (буквы зафиксировались и видны целиком), затем взрываем
      setTimeout(() => {
        // Создаем вспышку частиц из центра
        createShatterParticles(titleBox);

        // Рассыпаем буквы
        titleBox.classList.add("shattered");

        // 3. Через 450мс после взрыва плавно убираем черный оверлей и открываем сайт
        setTimeout(() => {
          introScreen.classList.add("fade-out");
          siteContent.classList.add("visible");
        }, 450);
      }, totalDropDuration + 500);
    }

    // Создание дополнительных световых осколков при разлете
    function createShatterParticles(parent) {
      const rect = parent.getBoundingClientRect();
      const count = 45;

      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.classList.add("particle");
        p.style.left = `${rect.left + rect.width / 2}px`;
        p.style.top = `${rect.top + rect.height / 2}px`;

        const angle = Math.random() * Math.PI * 2;
        const dist = 150 + Math.random() * 350;
        p.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
        p.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function restartIntro() {
      runIntro();
    }

    // Автостарт при первой загрузке страницы
    window.addEventListener("DOMContentLoaded", runIntro);
  </script>
</body>
</html>
